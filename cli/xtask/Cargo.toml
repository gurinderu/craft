[package]
name = "xtask"
description = "The repository's own checks, run as `cargo xtask <name>` from cli/: the gate's runner and its completeness. Never shipped: the release builds only `-p craft`."
# The workspace's version: release-please moves every local package's version in cli/Cargo.lock, so one of its own
# would leave the lock out of step with this file.
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
regex.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
