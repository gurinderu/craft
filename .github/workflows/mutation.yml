name: Mutation testing

# Weekly Stryker run over lib/ (realm @nick/craft, #146): how much of lib/'s logic the unit tests pin.
# Not a PR check and not a gate: it runs on a schedule and by hand, never on push or pull_request, so a
# red run here blocks no merge. It turns red when the score falls below the floor in lib/mutation-floor.json
# (stryker.config.mjs's `thresholds.break`; it may only rise, which CI's `test` job holds on pull requests),
# and a red run opens an issue — that is the signal, read in the report artifact, not a failure to fix in place.
on:
  schedule:
    # Sundays 03:17 UTC: a quiet hour for the shared runners, off the top of the hour most crons pick.
    - cron: '17 3 * * 0'
  workflow_dispatch:

# issues: write is this workflow's alone — the steps that open an issue for a red run need it.
permissions:
  contents: read
  issues: write

# A manual run while the weekly one is still going waits for it rather than racing it.
concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-latest
    # Both limits are extrapolated, not observed: a local full run's wall time times its worker count gives
    # worker-minutes, spread over the runner's four slower workers with headroom, then scaled by the mutant
    # count now over the count then (`npx stryker run --dryRunOnly` logs `Instrumented … with <N> mutant(s)`)
    # and rounded up; the dated measurements are the realm's. Both stay under GitHub's 360-minute job cap so
    # a hung run is cut off sooner. The Stryker step has its own, shorter limit: a step that times out fails, so the steps
    # after it still run and report it. A job cut by its own timeout runs none of its steps after the cut; whether
    # its result is then `failure` (reported by the job `report-lost-runner` below) or `cancelled` (reported by
    # nothing) is unobserved.
    timeout-minutes: 275
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dev tooling
        run: npm ci
      # inPlace mode runs the tsc-backed tests against the real tree, which read the plugin's tsc.
      - name: Install opencode plugin deps
        run: npm ci --prefix opencode/plugin
      # ubuntu-latest has 4 vCPUs; four Vitest workers keep them busy while each test runner idles on
      # the child processes (git, tsc) its tests spawn.
      - name: Stryker over lib/
        id: stryker
        timeout-minutes: 260
        run: npm run test:mutation -- --concurrency 4
      # Uploaded on a red run too (below `break`). Stryker writes both files only when the run completes,
      # so a run cut by the timeout has nothing to upload under any `if:` — its job log, with the
      # progress lines, is all it leaves.
      - name: Upload the mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            reports/mutation/mutation.html
            reports/mutation/mutation.json
          if-no-files-found: warn
          retention-days: 90
      # A red Stryker step — below lib/mutation-floor.json, or cut by its own timeout — is reported in one open
      # issue: while one titled "Weekly mutation run failed (…)" is open, the run and its score are a comment
      # on it; only when none is open is one created, titled with the score (lib/mutation-issue.mjs).
      # Only the Stryker step's own failure reports here: an upload that fails after a green Stryker step
      # makes the job red too, and `failure()` alone would file it with a score above the floor; a failed setup
      # or install leaves the Stryker step `skipped`, which the job `report-lost-runner` files, so filing it here
      # too would file it twice. `failure()` stays in the condition, since without a status check function
      # `success()` is implied.
      - name: Report the red run in an issue
        if: ${{ failure() && steps.stryker.conclusion == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node lib/mutation-issue.mjs reports/mutation/mutation.json

  # A runner lost mid-run ("The runner has received a shutdown signal") runs nothing after the step it cut:
  # on run 40423145899 the Stryker step ended `cancelled`, every later step — the `always()` post-steps too —
  # `skipped`, and the job `failure`, so no step of that job can report it. This job does, on its own runner.
  # `!cancelled()` keeps out a run cancelled by a person (and lets this job run after a failed one, where the
  # implied `success()` would skip it); `result == 'failure'` keeps out a green run. Inside, the script files
  # whenever the Stryker step did not itself end `failure` (the step above's) or `success` (a later step
  # failed): `cancelled` (a lost runner), `skipped` (a runner lost, or a step failed, during setup or install)
  # or not found (renamed: mutation-issue.test.mjs ties the names to this file) — the issue names which.
  # A job cut by its own timeout reaches this job only if its result is `failure`, which is unobserved.
  report-lost-runner:
    needs: mutation
    if: ${{ !cancelled() && needs.mutation.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read lets `gh run view --json jobs` read the mutation job's step conclusions.
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report a mutation job cut off before Stryker's own verdict
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node lib/mutation-issue.mjs --lost-runner "${{ github.run_id }}"
