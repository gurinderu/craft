name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The craft CLI built for each platform lib/craft-bin.mjs fetches, attached to the release just cut as
  # craft-<target>.tar.gz (the binary `craft` at the archive root) and its .sha256. The CLI's version is the
  # plugin's (release-please moves cli/Cargo.toml and cli/Cargo.lock with the manifest; the lock's filter was
  # observed on release-please 17.3.0, the one this action's v4.4.1 bundles — re-check it when the action moves,
  # and ci.yml's rust job, run with --locked on main, fails on a lock left behind), so the binary a
  # plugin version fetches is the one built from that version's tag. Each runner builds for its own host:
  # the step below refuses a runner whose host is not the matrix target, so no archive is mislabelled. Linux
  # builds are static musl (any distro's libc, however old); the runner's host is gnu on the same arch, so for
  # musl the guard compares the target with its gnu twin. musl needs no musl-tools: no crate compiles C code,
  # and Rust links the musl targets with its own self-contained C runtime.
  cli-binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      # The same pin as ci.yml's rust job: cli/rust-toolchain.toml names this version — move them together.
      # Its components too, as rust-toolchain.toml lists them: rustup would otherwise have to add them itself.
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: host is the matrix target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          want="$TARGET"
          case "$TARGET" in *-linux-musl) want="${TARGET%-musl}-gnu" ;; esac
          [ "$host" = "$want" ] || { echo "::error::runner host $host is not $want (for $TARGET)"; exit 1; }
      - name: cargo build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - name: package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive="craft-$TARGET.tar.gz"
          tar -czf "$archive" -C "target/$TARGET/release" craft
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          cat "$archive.sha256"
      - name: upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          TARGET: ${{ matrix.target }}
        run: gh release upload "$TAG" "craft-$TARGET.tar.gz" "craft-$TARGET.tar.gz.sha256" --clobber --repo "$GITHUB_REPOSITORY"
