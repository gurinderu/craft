name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# One run at a time: the guard below may wait on a build, and two runs must not cut the same release.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  # No release is cut from a commit whose targets were not built (realm @nick/craft, #671). A pull request no longer
  # builds the release targets, and release-please's own PR gets no CI at all, so the guard is here. release-please
  # tags the release PR's merge commit, whatever was pushed since; so while a merged release PR awaits its release
  # (read from the pulls list, not the search index, which lags a merge), this job waits for native-builds on that
  # very commit — its push to main started one — and passes only on a green run. On a red one, or none, it fails,
  # release-please does not run and no tag is cut: re-run the failed native-builds run if the runner was at fault,
  # then this workflow; a commit that does not build for a target is not released. A push with no release pending
  # passes at once.
  targets-built:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: a pending release waits for its commit's targets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=100" --jq '[.[] | select(.merged_at != null) | select(any(.labels[]; .name == "autorelease: pending"))][0].merge_commit_sha // ""')"
          if [ -z "$sha" ]; then echo "no merged release PR awaits its release"; exit 0; fi
          echo "a release is pending at $sha: waiting for native-builds on it"
          started="$(date +%s)"
          while :; do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/native-builds.yml/runs?head_sha=$sha&per_page=50" --jq '[.workflow_runs[] | {status, conclusion}]')"
            if [ "$(echo "$runs" | jq '[.[] | select(.conclusion == "success")] | length')" -gt 0 ]; then echo "native-builds is green for $sha"; exit 0; fi
            waited=$(( $(date +%s) - started ))
            # A run just queued may not be listed yet: none at all is a failure only after three minutes.
            if [ "$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')" = 0 ] && { [ "$runs" != "[]" ] || [ "$waited" -gt 180 ]; }; then
              echo "::error::a release is pending at $sha and native-builds has no green run for it ($runs): no release is cut. Re-run that native-builds run if the runner was at fault, then this workflow; a commit that does not build for a target is not released."
              exit 1
            fi
            sleep 30
          done

  release-please:
    needs: targets-built
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The craft CLI built for each platform integrations/shared/craft-bin.mjs fetches, attached to the release just cut as
  # craft-<target>.tar.gz (the binary `craft` at the archive root, `craft.exe` for Windows) and its .sha256. The
  # CLI's version is the plugin's (release-please moves cli/Cargo.toml and cli/Cargo.lock with the manifest; the lock's filter was
  # observed on release-please 17.3.0, the one this action's v4.4.1 bundles — re-check it when the action moves,
  # and ci.yml's rust job, run with --locked on main, fails on a lock left behind), so the binary a
  # plugin version fetches is the one built from that version's tag. Each runner builds for its own host:
  # the step below refuses a runner whose host is not the matrix target, so no archive is mislabelled. Linux
  # builds are static musl (any distro's libc, however old); the runner's host is gnu on the same arch, so for
  # musl the guard compares the target with its gnu twin. The C the build compiles (tree-sitter's runtime and its
  # Rust grammar, through `cc`, for the consumers list's structural search) needs a musl C compiler: the runner's own
  # gcc builds against glibc's headers. Each Linux runner is native to its arch, so musl-tools' `musl-gcc` is
  # that compiler for both, no cross toolchain; Rust still links with its self-contained musl runtime.
  # native-builds.yml builds every target the same way on each push to main and on a pull request that touches the
  # build's inputs (realm @nick/craft, #671). Windows is a tar.gz too: craft-bin
  # unpacks it with the tar.exe Windows 10 and later ship; every step runs in bash (Git Bash on the Windows runner).
  cli-binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      # The same pin as ci.yml's rust job: cli/rust-toolchain.toml names this version — move them together.
      # Its components too, as rust-toolchain.toml lists them: rustup would otherwise have to add them itself.
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: host is the matrix target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          want="$TARGET"
          case "$TARGET" in *-linux-musl) want="${TARGET%-musl}-gnu" ;; esac
          [ "$host" = "$want" ] || { echo "::error::runner host $host is not $want (for $TARGET)"; exit 1; }
      - name: musl C compiler
        if: ${{ endsWith(matrix.target, '-linux-musl') }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: cargo build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            *-linux-musl) export "CC_$(echo "$TARGET" | tr - _)=musl-gcc" ;;
          esac
          cargo build --release --locked --target "$TARGET"
      - name: package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive="craft-$TARGET.tar.gz"
          bin=craft
          case "$TARGET" in *-windows-*) bin=craft.exe ;; esac
          tar -czf "$archive" -C "target/$TARGET/release" "$bin"
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          cat "$archive.sha256"
      - name: upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          TARGET: ${{ matrix.target }}
        run: gh release upload "$TAG" "craft-$TARGET.tar.gz" "craft-$TARGET.tar.gz.sha256" --clobber --repo "$GITHUB_REPOSITORY"

  # The Claude Code plugin without symlinks, rebuilt from the release's tag as the next commit of the
  # claude-code-plugin branch (the first such release creates it) — claude-code-plugin.yml. The marketplace entry
  # installs the plugin from this branch.
  claude-code-plugin:
    needs: [release-please, cli-binaries]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/claude-code-plugin.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}

  # The OpenCode 2.x package, rebuilt from the release's tag as the next commit of the opencode-plugin branch and
  # tagged opencode-vX.Y.Z (the first such release creates both) — opencode-plugin.yml. `opencode plugin add` installs
  # the package from that tag; its review runs the release binaries the job above uploads.
  opencode-plugin:
    needs: [release-please, cli-binaries]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/opencode-plugin.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
