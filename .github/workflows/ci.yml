name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dev tooling
        run: npm ci
      # The opencode plugin has its own dependency closure (pinned exact + package-lock.json), kept
      # out of the root package.json so the shipped plugin still installs with nothing to fetch.
      # `npm ci` here is what makes the typecheck step below possible.
      - name: Install opencode plugin deps
        run: npm ci --prefix opencode/plugin
      # Lint reaches the .mjs files under lib/ and opencode/plugin/, opencode/plugin/*.ts, and
      # knip.config.js (it imports lib/inline-regions.mjs and decides what the dead-code gate sees), and
      # .dependency-cruiser.mjs (it decides what the shipped-imports step below sees), with
      # typescript-eslint's type-aware rules over each tsconfig's program (so it needs the plugin
      # deps above). workflows/*.js cannot be parsed by ESLint for the same reason `node --check`
      # cannot read them — the syntax-check and engine typecheck steps below are their gates.
      # Keep this command identical to package.json's "lint".
      - name: Lint
        run: npx eslint lib opencode/plugin knip.config.js .dependency-cruiser.mjs --max-warnings 0
      # tsc over opencode/plugin/*.ts and every opencode/plugin/*.mjs, tests included (config in
      # opencode/plugin/tsconfig.json: checkJs at the same maximum strictness as lib/tsconfig.json).
      # This is the only gate that compiles the TypeScript at all; before it existed a syntax error
      # there shipped green. Its Node typings are the plugin's own pinned @types/node, not Node 22.
      # It type-checks only — no emit — and does not cover the .md agents/commands beside it.
      - name: Typecheck opencode plugin
        run: npm run check:types
      # tsc --checkJs at maximum strictness (strict, noUncheckedIndexedAccess, exactOptionalPropertyTypes
      # and the rest; lib/tsconfig.json) over every lib/**/*.mjs, tests included, so a new module is strict at once.
      # The compiler is the opencode plugin's pinned tsc (needs `npm ci --prefix opencode/plugin` above);
      # the Node typings are the root's @types/node 22.x, matching the Node this code runs on — the
      # plugin's newer typings would let post-22 APIs through. Types come from JSDoc; nothing shipped changes.
      - name: Typecheck lib (checkJs)
        run: npm run check:types:lib
      # The engines' own code (workflows/*.js) at the same strictness: each script wrapped as the sandbox
      # runs it, its craft-inline regions swapped for imports of the lib modules they come from, the
      # sandbox globals declared in lib/workflow-sandbox.d.ts; errors reported at their workflows/ line.
      # On the same program, typescript-eslint's no-unsafe-* family holds each engine to zero (needs the
      # root deps; a missing ESLint fails the step).
      - name: Typecheck workflow engines (checkJs)
        run: npm run check:types:workflows
      # run-record helpers are the only unit-tested code (workflows inline verbatim copies of them).
      - name: Unit tests
        run: npm test
      # Workflow scripts can't be `node --check`'d directly (top-level export+await+return); this
      # reproduces the sandbox wrapper and compile-checks each one. It also regenerates every fenced
      # `craft-inline` region from lib/ and fails on any drift in the pasted-in helper copies.
      - name: Syntax-check workflow scripts
        run: node lib/check-workflows.mjs
      # Validate skill/agent frontmatter and that every internal craft:<slug> reference resolves.
      - name: Check skills & agents
        run: node lib/check-skills.mjs
      # Compares the SET OF OUTCOMES each review agent's two deliveries (agents/ vs opencode/agents/)
      # can report, mapped from the rubric's words — not the two bodies in full, which can still
      # diverge in guidance and detail with this gate green.
      - name: Check delivery parity
        run: node lib/check-delivery-parity.mjs
      # The opencode delivery's agents/commands answer to a different frontmatter contract than the
      # Claude Code ones above (no `name`, no pinned `model`, `mode: subagent`, `hidden: true`,
      # `tools` a map with write/edit false), so it gets its own checker rather than a widened one.
      # Shape only — it says nothing about whether an agent's description makes it trigger.
      - name: Check opencode agent/command frontmatter
        run: npm run check:opencode-frontmatter
      # Static shape-check of the skill-triggering eval corpus (evals/evals.json): well-formed cases,
      # every referenced skill exists. The model-based triggering evals themselves are a local
      # harness (need a live model) — see evals/README.md — and are intentionally NOT run in CI.
      - name: Check evals corpus
        run: node lib/check-evals.mjs
      # What the shipped Node entries (lib/shipped-entries.mjs) reach through their imports: no test file
      # and no npm package beyond the plugin's @opencode-ai/* (.dependency-cruiser.mjs). Both fail only in a
      # consumer's repo, where no devDependency is installed; Knip, tsc and the unit tests let them through.
      # lib/dependency-cruiser-config.test.mjs plants each.
      - name: Check what shipped entries import (dependency-cruiser)
        run: npm run check:deps
      # Unused files, exports and dependencies across lib/, workflows/ and the opencode plugin
      # (knip.config.js). An inlined export counts as used only where an engine references it outside
      # its source's own craft-inline regions: listed in a fence but never called is dead. Production mode drops tests and checks what the shipped entries reach, so an
      # export only a test uses is dead here. The default mode, tests included, is kept beside it:
      # only it sees devDependencies and what the tests import (an unused or unlisted package).
      - name: Check unused code, shipped entries (knip --production)
        run: npm run check:dead:production
      - name: Check unused code and dependencies, tests included (knip)
        run: npm run check:dead
      # Copied code outside the craft-inline mechanism (lib/check-dup.mjs running jscpd on .jscpd.json):
      # lib/, opencode/plugin/ and workflows/*.js, tests excluded (fixture boilerplate), each fenced region
      # skipped — its copy is byte-compared by the syntax-check step above, which is why a fence-shaped
      # line in a scanned file other than workflows/*.js fails this step. A new clone is read from
      # jscpd's report; a non-zero exit with none (a missing platform package, a config error) fails as
      # jscpd failing, not as a copy. Exact clones of at least 50 tokens and 5 lines.
      # Copies present on adoption are in .jscpd-baseline.json; a clone not in it fails. Its count is held
      # to lib/dup-ceiling.json, which may only fall: a regenerated baseline that absorbed a new copy
      # fails, and so does one still listing a copy no longer found. Fingerprints cover a clone's whole
      # extent, so an edit in or beside a baselined copy reads as a new clone: `npm run check:dup:baseline`
      # regenerates it, the count unchanged. `maxSize` 10mb (review.js is past half the 1mb default) and
      # `failOnEmpty` turn off two silent skips; one remains — an ignorePattern jscpd cannot compile is
      # dropped with a warning (lib/check-dup.test.mjs pins the pattern to the fence regexes).
      - name: Check duplicated code (jscpd)
        run: npm run check:dup
      # The mutation floor (lib/mutation-floor.json, the weekly Stryker run's `thresholds.break`) may only
      # rise: on a pull request it is compared with the base's (lib/check-mutation-floor.mjs). The checkout
      # holds only the merge commit, so the base is fetched first; a base that cannot be read fails the step.
      - name: Check the mutation floor does not fall
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node lib/check-mutation-floor.mjs --base "$BASE_SHA"
      # Official schema-authoritative validator: marketplace + plugin manifest, --strict so stray or
      # misspelled fields become errors. Complements the custom frontmatter/cross-ref check above.
      - name: Validate plugin manifests
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
      # The OpenCode plugin's dependencies are the only ones a consumer installs (craft itself ships
      # none), so a known high-severity advisory in its LOCKED production closure fails the build.
      # Last in the job, so a red audit never hides the other checks' verdict on the diff.
      # Deliberately not reproducible: a new advisory, or an unreachable registry, can turn a commit red
      # that was green (realm @nick/craft, #141). Green here is not a claim about a consumer's install:
      # per opencode/README.md the plugin's deps land in the consumer's opencode tree (or they add
      # @opencode-ai/plugin and @opencode-ai/sdk, unpinned, to their own package.json) — that closure
      # is whatever their tree resolves, and this audit does not cover it.
      - name: Audit shipped dependencies
        run: npm audit --prefix opencode/plugin --omit=dev --audit-level=high
      # Dev tooling never reaches a consumer: an advisory there is reported — a warning annotation on the
      # run and the job summary — not blocking, so a new advisory in a linter does not turn unrelated PRs
      # red. Fix with `npm audit fix` in its own PR. Runs even when an earlier step failed. An advisory is
      # told apart from a failure to audit (registry unreachable, unreadable output) by the JSON counts.
      - name: Audit dev tooling (report only)
        if: ${{ !cancelled() }}
        run: |
          npm audit --json > dev-audit.json 2> dev-audit.err || true
          if n=$(node -e 'const v=JSON.parse(require("fs").readFileSync("dev-audit.json","utf8")).metadata.vulnerabilities; const n=v.high+v.critical; if(!Number.isInteger(n)) process.exit(1); console.log(n)' 2>/dev/null); then
            if [ "$n" -gt 0 ]; then
              echo "::warning title=npm audit (dev tooling)::$n dev-tooling package(s) with a high/critical advisory; fix with npm audit fix in its own PR"
              { echo '### npm audit (dev tooling, not blocking)'; echo '```'; npm audit --audit-level=high 2>&1 | tail -n 40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning title=npm audit (dev tooling)::could not audit dev tooling (see the step log); not blocking"
            { echo '### npm audit (dev tooling): could not audit, not blocking'; echo '```'; tail -n 20 dev-audit.err; tail -n 20 dev-audit.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Static analysis with semgrep's public registry rule sets, plus craft's own shell-command rule, over
  # lib/, opencode/plugin/ and workflows/ (not opencode/install.sh or .github/). It found nothing real on adoption — it is here for code
  # not yet written (realm @nick/craft, #138). A separate job, not a step in `test`: it is a Python
  # tool in its own pinned image and fails on its own. Not reproducible, like the dependency audit
  # (#141): `--config p/...` fetches the registry's rules as of the run, so a rule added upstream can
  # turn a commit red that was green before; the image tag pins the engine, not the rules.
  # A known false positive is suppressed in place with `nosemgrep: <rule-id>` and its reason.
  # Every silent skip is turned off, since each reads as a clean run: `--timeout 0` (a rule that timed out
  # on a file is skipped with exit 0), `--max-target-bytes 0` (a file over 1 MB is skipped with exit 0 —
  # review.js is half that and growing), `--strict` (a partial parse fails instead of warning).
  # .semgrep/child-process.yml covers `node:child_process`, the spelling the registry rule misses; its
  # fixtures run first, so a rule that stopped firing fails the job.
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@v4
      - name: semgrep (craft's own rules match their fixtures)
        run: >-
          semgrep --test --metrics=off --config .semgrep/child-process.yml .semgrep/child-process.mjs &&
          semgrep --test --metrics=off --config .semgrep/child-process.yml .semgrep/child-process-cjs.js
      - name: semgrep (public rule sets and craft's own)
        run: >-
          semgrep scan --metrics=off --error --strict --timeout 0 --max-target-bytes 0
          --config .semgrep/child-process.yml --config p/javascript --config p/typescript --config p/nodejs
          --config p/security-audit --config p/secrets --config p/default
          lib opencode/plugin workflows

  # How quality moved between the PR's base and head — complexity, lint and type errors, tests, Knip,
  # import cycles — written to the job summary as a signal for review, never a gate (realm @nick/craft,
  # #147): the `test` job keeps its own zeros. This job always ends green after writing the summary; an
  # install or a metric that failed is reported there as "failed to measure", not hidden behind
  # continue-on-error. No PR comment, so no permission beyond reading the code.
  quality-delta:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # One step that never fails: install and measuring errors go into the summary, then exit 0.
      # The measuring code is head's (lib/quality-delta.mjs); each side is measured with its own tooling.
      - name: Measure base and head, write the quality delta to the job summary
        run: |
          set +e
          for side in base head; do
            for prefix in . opencode/plugin; do
              if ! npm ci --prefix "$side/$prefix" > install.log 2>&1; then
                echo "> **$side**: \`npm ci --prefix $prefix\` failed; metrics needing it show as failed to measure." >> "$GITHUB_STEP_SUMMARY"
                tail -n 20 install.log
              fi
            done
          done
          if ! node head/lib/quality-delta.mjs --base base --head head > quality-delta.md 2> quality-delta.err; then
            { echo '### Quality delta: the measuring tool itself failed (not blocking)'; echo '```'; tail -n 20 quality-delta.err; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          cat quality-delta.md >> "$GITHUB_STEP_SUMMARY"
          cat quality-delta.md quality-delta.err
          exit 0
