name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dev tooling
        run: npm ci
      # The opencode plugin has its own dependency closure (pinned exact + package-lock.json), kept
      # out of the root package.json so the shipped plugin still installs with nothing to fetch.
      # `npm ci` here is what makes the typecheck step below possible.
      - name: Install opencode plugin deps
        run: npm ci --prefix opencode/plugin
      # Lint reaches only the .mjs files under lib/ and opencode/plugin/. workflows/*.js cannot be
      # parsed by ESLint for the same reason `node --check` cannot read them — the syntax-check
      # step below is their gate. opencode/plugin/*.ts are outside ESLint's default globs — the
      # typecheck step below is their gate. Keep this command identical to package.json's "lint".
      - name: Lint
        run: npx eslint lib opencode/plugin --max-warnings 0
      # tsc over opencode/plugin/*.ts and every opencode/plugin/*.mjs, tests included (config in
      # opencode/plugin/tsconfig.json: checkJs at the same maximum strictness as lib/tsconfig.json).
      # This is the only gate that compiles the TypeScript at all; before it existed a syntax error
      # there shipped green. Its Node typings are the plugin's own pinned @types/node, not Node 22.
      # It type-checks only — no emit — and does not cover the .md agents/commands beside it.
      - name: Typecheck opencode plugin
        run: npm run check:types
      # tsc --checkJs at maximum strictness (strict, noUncheckedIndexedAccess, exactOptionalPropertyTypes
      # and the rest; lib/tsconfig.json) over every lib/**/*.mjs, tests included, so a new module is strict at once.
      # The compiler is the opencode plugin's pinned tsc (needs `npm ci --prefix opencode/plugin` above);
      # the Node typings are the root's @types/node 22.x, matching the Node this code runs on — the
      # plugin's newer typings would let post-22 APIs through. Types come from JSDoc; nothing shipped changes.
      - name: Typecheck lib (checkJs)
        run: npm run check:types:lib
      # The engines' own code (workflows/*.js) at the same strictness: each script wrapped as the sandbox
      # runs it, its craft-inline regions swapped for imports of the lib modules they come from, the
      # sandbox globals declared in lib/workflow-sandbox.d.ts; errors reported at their workflows/ line.
      # Agent results are typed `any` (model output), so fields read off them are not checked.
      - name: Typecheck workflow engines (checkJs)
        run: npm run check:types:workflows
      # run-record helpers are the only unit-tested code (workflows inline verbatim copies of them).
      - name: Unit tests
        run: node --test 'lib/**/*.test.mjs' 'opencode/**/*.test.mjs'
      # Workflow scripts can't be `node --check`'d directly (top-level export+await+return); this
      # reproduces the sandbox wrapper and compile-checks each one. It also regenerates every fenced
      # `craft-inline` region from lib/ and fails on any drift in the pasted-in helper copies.
      - name: Syntax-check workflow scripts
        run: node lib/check-workflows.mjs
      # Validate skill/agent frontmatter and that every internal craft:<slug> reference resolves.
      - name: Check skills & agents
        run: node lib/check-skills.mjs
      # Compares the SET OF OUTCOMES each review agent's two deliveries (agents/ vs opencode/agents/)
      # can report, mapped from the rubric's words — not the two bodies in full, which can still
      # diverge in guidance and detail with this gate green.
      - name: Check delivery parity
        run: node lib/check-delivery-parity.mjs
      # The opencode delivery's agents/commands answer to a different frontmatter contract than the
      # Claude Code ones above (no `name`, no pinned `model`, `mode: subagent`, `hidden: true`,
      # `tools` a map with write/edit false), so it gets its own checker rather than a widened one.
      # Shape only — it says nothing about whether an agent's description makes it trigger.
      - name: Check opencode agent/command frontmatter
        run: npm run check:opencode-frontmatter
      # Static shape-check of the skill-triggering eval corpus (evals/evals.json): well-formed cases,
      # every referenced skill exists. The model-based triggering evals themselves are a local
      # harness (need a live model) — see evals/README.md — and are intentionally NOT run in CI.
      - name: Check evals corpus
        run: node lib/check-evals.mjs
      # Official schema-authoritative validator: marketplace + plugin manifest, --strict so stray or
      # misspelled fields become errors. Complements the custom frontmatter/cross-ref check above.
      - name: Validate plugin manifests
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
      # The OpenCode plugin's dependencies are the only ones a consumer installs (craft itself ships
      # none), so a known high-severity advisory in its LOCKED production closure fails the build.
      # Last in the job, so a red audit never hides the other checks' verdict on the diff.
      # Deliberately not reproducible: a new advisory, or an unreachable registry, can turn a commit red
      # that was green (realm @nick/craft, #141). Consumers resolve floating transitives via Bun, so
      # green here is not a claim about their install.
      - name: Audit shipped dependencies
        run: npm audit --prefix opencode/plugin --omit=dev --audit-level=high
      # Dev tooling never reaches a consumer: an advisory there is reported — a warning annotation on the
      # run and the job summary — not blocking, so a new advisory in a linter does not turn unrelated PRs
      # red. Fix with `npm audit fix` in its own PR.
      - name: Audit dev tooling (report only)
        run: |
          if ! npm audit --audit-level=high > dev-audit.txt 2>&1; then
            echo "::warning title=npm audit (dev tooling)::high-severity advisory in dev tooling; fix with npm audit fix in its own PR"
            { echo '### npm audit (dev tooling, not blocking)'; echo '```'; tail -n 40 dev-audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
