name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dev tooling
        run: npm ci
      # The opencode plugin has its own dependency closure (pinned exact + package-lock.json), kept
      # out of the root package.json so the shipped plugin still installs with nothing to fetch.
      # `npm ci` here is what makes the typecheck step below possible.
      - name: Install opencode plugin deps
        run: npm ci --prefix integrations/opencode/plugin
      # The gate's runner and its completeness check are cli/xtask (`cargo xtask gate`, `cargo xtask gate-steps`), so
      # the job needs the CLI's toolchain — the same pin as the rust job, which cli/rust-toolchain.toml names.
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: gate
      # just runs the justfile's gate; pinned to the dev shell's version (flake.nix's nixpkgs), the action by its commit.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.51.0'
      # The gate as one call (the justfile's gate group, run by cli/xtask): lint, the three typechecks, the unit
      # tests, the gate's completeness, the workflow, skill, delivery-parity, OpenCode-frontmatter and eval
      # checkers, dependency-cruiser, both Knip runs, jscpd, the mutation floor and the plugin manifest validators
      # — the same command an agent runs before pushing, so a check dropped from it is dropped from both at once,
      # and `cargo xtask gate-steps` fails when a check package.json, integrations/shared/check-*.mjs, this job,
      # AGENTS.md "Commands" or the justfile names is not in it. Every step runs, a failed one included, and the
      # log names each one's result. On a pull request the checkout holds only the merge commit, so the base is
      # fetched for the mutation floor to compare with (a base that cannot be read fails that step); on a push it
      # compares with origin/main.
      - name: Gate (just gate)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            just gate --base "$BASE_SHA"
          else
            just gate
          fi
      # The OpenCode plugin's dependencies are the only ones a consumer installs (craft itself ships
      # none), so a known high-severity advisory in its LOCKED production closure fails the build.
      # Last in the job, so a red audit never hides the other checks' verdict on the diff.
      # Deliberately not reproducible: a new advisory, or an unreachable registry, can turn a commit red
      # that was green (realm @nick/craft, #141). Green here is not a claim about a consumer's install:
      # per integrations/opencode/README.md the plugin's deps land in the consumer's opencode tree (or they add
      # @opencode-ai/plugin and @opencode-ai/sdk, unpinned, to their own package.json) — that closure
      # is whatever their tree resolves, and this audit does not cover it.
      - name: Audit shipped dependencies
        run: npm audit --prefix integrations/opencode/plugin --omit=dev --audit-level=high
      # Dev tooling never reaches a consumer: an advisory there is reported — a warning annotation on the
      # run and the job summary — not blocking, so a new advisory in a linter does not turn unrelated PRs
      # red. Fix with `npm audit fix` in its own PR. Runs even when an earlier step failed. An advisory is
      # told apart from a failure to audit (registry unreachable, unreadable output) by the JSON counts.
      - name: Audit dev tooling (report only)
        if: ${{ !cancelled() }}
        run: |
          npm audit --json > dev-audit.json 2> dev-audit.err || true
          if n=$(node integrations/shared/audit-count.mjs dev-audit.json 2>/dev/null); then
            if [ "$n" -gt 0 ]; then
              echo "::warning title=npm audit (dev tooling)::$n dev-tooling package(s) with a high/critical advisory; fix with npm audit fix in its own PR"
              { echo '### npm audit (dev tooling, not blocking)'; echo '```'; npm audit --audit-level=high 2>&1 | tail -n 40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning title=npm audit (dev tooling)::could not audit dev tooling (see the step log); not blocking"
            { echo '### npm audit (dev tooling): could not audit, not blocking'; echo '```'; tail -n 20 dev-audit.err; tail -n 20 dev-audit.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The Rust CLI in cli/ (realm @nick/craft, #445): format, lint at zero warnings (the workspace
  # lints in cli/Cargo.toml become hard here), and the tests, cli/xtask's included. A job of its own, not a gate
  # step: `just gate` covers the Node side, and `cargo xtask gate-steps` reads only the `test` job.
  # The release builds for every target are native-builds.yml's, not every pull request's (realm @nick/craft, #671).
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      # The toolchain is pinned in cli/rust-toolchain.toml, which rustup honours for every cargo
      # call under cli/; this step installs that same version with its components — move both together.
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked
      # The parity files the CLI owns are what it renders: regenerated, they must not change.
      - name: parity files are current
        run: |
          CRAFT_UPDATE_PARITY=1 cargo test -p craft-review --locked parity
          git diff --exit-code ../content/parity

  # Exercise native process identity and both writer boundaries on the operating systems whose
  # Node writer uses the craft helper (realm @nick/craft, #563); cross-compilation is not execution.
  # Since the release-target builds left the pull request (#671), this is also the only compile macOS and Windows
  # get on an ordinary one: narrowing it removes that.
  store-native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Native process identity, writer interoperability and the paged step file
        run: cargo test -p craft --locked --test process_identity --test paged

  # Static analysis with semgrep's public registry rule sets, plus craft's own shell-command rule, over
  # integrations/shared/, integrations/opencode/plugin/ and integrations/claude-code/workflows/ (not integrations/opencode/install.sh or
  # .github/). It found nothing real on adoption — it is here for code
  # not yet written (realm @nick/craft, #138). A separate job, not a step in `test`: it is a Python
  # tool in its own pinned image and fails on its own. Not reproducible, like the dependency audit
  # (#141): `--config p/...` fetches the registry's rules as of the run, so a rule added upstream can
  # turn a commit red that was green before; the image tag pins the engine, not the rules.
  # A known false positive is suppressed in place with `nosemgrep: <rule-id>` and its reason.
  # Every silent skip is turned off, since each reads as a clean run: `--timeout 0` (a rule that timed out
  # on a file is skipped with exit 0), `--max-target-bytes 0` (a file over 1 MB is skipped with exit 0 —
  # review.js is half that and growing), `--strict` (a partial parse fails instead of warning).
  # .semgrep/child-process.yml covers `node:child_process`, the spelling the registry rule misses; its
  # fixtures run first, so a rule that stopped firing fails the job.
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@v4
      - name: semgrep (craft's own rules match their fixtures)
        run: >-
          semgrep --test --metrics=off --config .semgrep/child-process.yml integrations/shared/fixtures/semgrep/child-process.mjs &&
          semgrep --test --metrics=off --config .semgrep/child-process.yml integrations/shared/fixtures/semgrep/child-process-cjs.js
      - name: semgrep (public rule sets and craft's own)
        run: >-
          semgrep scan --metrics=off --error --strict --timeout 0 --max-target-bytes 0
          --config .semgrep/child-process.yml --config p/javascript --config p/typescript --config p/nodejs
          --config p/security-audit --config p/secrets --config p/default
          --exclude integrations/shared/config --exclude integrations/shared/fixtures
          integrations/shared integrations/pi integrations/opencode/plugin integrations/claude-code/workflows

  # How quality moved between the PR's base and head — complexity, lint and type errors, tests, Knip,
  # import cycles — written to the job summary as a signal for review, never a gate (realm @nick/craft,
  # #147): the `test` job keeps its own zeros. This job always ends green after writing the summary; an
  # install or a metric that failed is reported there as "failed to measure", not hidden behind
  # continue-on-error. No PR comment, so no permission beyond reading the code.
  quality-delta:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # One step that never fails: install and measuring errors go into the summary, then exit 0.
      # The measuring code is head's (integrations/shared/quality-delta.mjs); each side is measured with its own tooling.
      - name: Measure base and head, write the quality delta to the job summary
        run: |
          set +e
          # The OpenCode plugin moved from opencode/plugin to integrations/opencode/plugin: a side installs the one it has.
          for side in base head; do
            for prefix in . opencode/plugin integrations/opencode/plugin; do
              [ -f "$side/$prefix/package.json" ] || continue
              if ! npm ci --prefix "$side/$prefix" > install.log 2>&1; then
                echo "> **$side**: \`npm ci --prefix $prefix\` failed; metrics needing it show as failed to measure." >> "$GITHUB_STEP_SUMMARY"
                tail -n 20 install.log
              fi
            done
          done
          if ! node head/integrations/shared/quality-delta.mjs --base base --head head > quality-delta.md 2> quality-delta.err; then
            { echo '### Quality delta: the measuring tool itself failed (not blocking)'; echo '```'; tail -n 20 quality-delta.err; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          cat quality-delta.md >> "$GITHUB_STEP_SUMMARY"
          cat quality-delta.md quality-delta.err
          exit 0
