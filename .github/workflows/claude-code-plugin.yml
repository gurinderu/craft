name: claude-code-plugin

# The Claude Code plugin without symlinks, for consumers whose clone does not make them (core.symlinks=false, the
# Windows default, turns each of integrations/claude-code's links into a one-line text file the harness then caches
# as it is). One ref's delivery, every link dereferenced, becomes the next commit of the claude-code-plugin branch,
# which the marketplace entry's `url` source names (lib/materialize-claude-code.mjs). Its plugin.json carries that
# ref's version, so an install or update moves with release-please.
#
# release-please.yml calls this with the tag of each release it cuts; the first release to carry this file (0.42.0)
# created the branch. GitHub dispatches only a workflow whose file is on the default branch, so by hand (`gh workflow run
# claude-code-plugin.yml -f ref=vX.Y.Z`) it only re-publishes the branch from a release tag once this file is on
# main. Either way the ref must be a release tag (vX.Y.Z) whose plugin.json carries that version: a branch or a
# commit would ship unreleased content under the last release's version, so the job refuses it before materializing.
on:
  workflow_call:
    inputs:
      ref:
        description: the release tag (vX.Y.Z) whose delivery is materialized
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: the release tag (vX.Y.Z) whose delivery is re-published
        required: true
        type: string

permissions:
  contents: write

jobs:
  claude-code-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: claude-code-plugin
      cancel-in-progress: false
    env:
      BRANCH: claude-code-plugin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Only a release tag is published: vX.Y.Z, a tag on the remote at the checked-out commit, and the plugin.json
      # it carries at that version. Anything else fails here, before the branch is touched.
      - name: require a release tag
        env:
          REF: ${{ inputs.ref }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "ref '$REF' is not a release tag (vX.Y.Z)"
          tagged="$(git ls-remote --tags origin "refs/tags/$REF" "refs/tags/$REF^{}" | tail -n1 | cut -f1)"
          [ -n "$tagged" ] || fail "no tag '$REF' on origin"
          [ "$tagged" = "$(git rev-parse HEAD)" ] || fail "tag '$REF' ($tagged) is not the checked-out commit"
          manifest=integrations/claude-code/.claude-plugin/plugin.json
          [ -f "$manifest" ] || fail "tag '$REF' has no $manifest"
          version="$(node -p "require('./$manifest').version")"
          [ "$version" = "${REF#v}" ] || fail "tag '$REF' carries plugin.json version '$version', not '${REF#v}'"
      - name: fetch the branch head
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch --no-tags origin "refs/heads/$BRANCH:refs/heads/$BRANCH"
          else
            echo "no $BRANCH yet: its first commit has no parent"
          fi
      - name: commit the materialized delivery
        env:
          REF: ${{ inputs.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node lib/materialize-claude-code.mjs --branch "$BRANCH" --message "craft $REF ($(git rev-parse HEAD)): the Claude Code plugin with its symlinks dereferenced"
      # What is about to be pushed, read back out of the commit: no symlink in it, and the plugin manifest with its
      # hooks valid as the harness reads them. A failure here pushes nothing.
      - name: validate the committed tree
        run: |
          tree="$RUNNER_TEMP/claude-code-plugin"
          mkdir -p "$tree"
          git archive "refs/heads/$BRANCH" | tar -x -C "$tree"
          links="$(find "$tree" -type l)"
          [ -z "$links" ] || { echo "::error::symlinks in the materialized tree:"; echo "$links"; exit 1; }
          npx --yes @anthropic-ai/claude-code@2.1.319 plugin validate "$tree/.claude-plugin/plugin.json" --strict
      # The checkout keeps no credential; the token reaches git for this push alone.
      - name: push
        env:
          TOKEN: ${{ github.token }}
        run: git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/$BRANCH:refs/heads/$BRANCH"
